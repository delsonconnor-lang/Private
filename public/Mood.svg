<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1024" viewBox="0 0 1728 1024">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1A8"/>
      <stop offset="18%" stop-color="#FFD45A"/>
      <stop offset="48%" stop-color="#E9A91B"/>
      <stop offset="72%" stop-color="#FFD95F"/>
      <stop offset="100%" stop-color="#B87300"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="35%" stop-color="#FFC83D"/>
      <stop offset="60%" stop-color="#FFF0A0"/>
      <stop offset="100%" stop-color="#D89208"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feColorMatrix in="offset" type="matrix"
        values="0 0 0 0 0.75
                0 0 0 0 0.45
                0 0 0 0 0.05
                0 0 0 0.55 0" result="goldShadow"/>
      <feMerge>
        <feMergeNode in="goldShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1728" height="1024" fill="#000000"/>

  <!-- Subtle golden glow -->
  <text x="864" y="515"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="235"
        font-weight="700"
        letter-spacing="-10"
        fill="#D89A19"
        opacity="0.16"
        filter="url(#glow)">Mood Cave</text>

  <!-- Main logo -->
  <text x="864" y="515"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="235"
        font-weight="700"
        letter-spacing="-10"
        fill="url(#gold)"
        stroke="#9A6100"
        stroke-width="2"
        paint-order="stroke fill"
        filter="url(#shadow)">Mood Cave</text>

  <!-- Fine highlight -->
  <text x="864" y="511"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="235"
        font-weight="700"
        letter-spacing="-10"
        fill="url(#goldHighlight)"
        opacity="0.32">Mood Cave</text>
</svg>
